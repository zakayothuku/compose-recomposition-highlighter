name: Android CI & Library Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build & Test Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew :library:test --no-daemon

      - name: Build Library AAR & Sample APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Maven Publication Bundle
        run: ./gradlew :library:generatePomFileForReleasePublication --no-daemon
